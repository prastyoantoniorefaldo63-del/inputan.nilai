
name: Build C++ EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Ambil Repository
        uses: actions/checkout@v4

      - name: Setup Compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Compile C++ menjadi EXE
        shell: msys2 {0}
        run: g++ main.cpp -o program.exe -static -static-libgcc -static-libstdc++

      - name: Upload File EXE
        uses: actions/upload-artifact@v4
        with:
          name: Program-EXE
          path: program.exe
